<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
        <title>01 box-model</title>
        <style>
            div {
				background-color: orange;
				width: 200px;
				width: 100%;
				width: auto;
				height: 200px;
				padding: 30px;
				margin: 20px auto;
				border: 2px solid red;
			}

			div.right {
				width: 50%;
				height: 200px;
				padding: 20px;
				box-sizing: border-box;
				margin-left: auto;
			}
        </style>
	</head>
	<body>
		<div>
			wow
		</div>
		<div class="right">
			wow
		</div>
	</body>
</html>
